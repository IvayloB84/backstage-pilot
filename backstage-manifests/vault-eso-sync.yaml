apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: default
spec:
  provider:
    vault:
      server: "http://vault-service.default.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "backstage-pilot-role"
          serviceAccountRef:
            name: "backstage-cluster-reader"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-app-config
  namespace: default
spec:
  refreshInterval: "15s" 
  
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
    
  target:
    name: backstage-app-config 
    creationPolicy: Owner
    
  data:
    - secretKey: KEYCLOAK_CLIENT_ID
      remoteRef:
        key: backstage
        property: KEYCLOAK_CLIENT_ID
        
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: backstage
        property: KEYCLOAK_CLIENT_SECRET

