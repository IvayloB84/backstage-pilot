apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-pilot-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/IvayloB84/backstage-pilot'
    targetRevision: main
    path: .
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backstage-pilot
      jsonPointers:
        - /spec/template/metadata/annotations