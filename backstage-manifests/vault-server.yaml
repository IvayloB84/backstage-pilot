apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-server-config
  namespace: default
spec:
  data:
    vault.json: |
      {
        "storage": {
          "file": {
            "path": "/vault/data"
          }
        },
        "listener": {
          "tcp": {
            "address": "0.0.0.0:8200",
            "tls_disable": 1
          }
        },
        "ui": true,
        "disable_mlock": true
      }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-server
  namespace: default
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:latest
        imagePullPolicy: Always
        args: ["server", "-config=/vault/config/vault.json"]
        ports:
        - containerPort: 8200
          name: http
        volumeMounts:
        - name: config-volume
          mountPath: /vault/config
        - name: storage-volume
          mountPath: /vault/data
      volumes:
      - name: config-volume
        configMap:
          name: vault-server-config
      - name: storage-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: default
spec:
  ports:
  - name: http
    port: 8200
    targetPort: 8200
  selector:
    app: vault