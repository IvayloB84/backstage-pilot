apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-server
  namespace: default
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:latest
        args: ["server", "-dev", "-dev-root-token-id=root-master-token-2026", "-dev-listen-address=0.0.0.0:8200"]
        ports:
        - containerPort: 8200
          name: http
          hostPort: 8200  # THE PERMANENT BRIDGE: Binds port 8200 directly to your Debian host desktop card!
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: default
spec:
  ports:
  - name: http
    port: 8200
    targetPort: 8200
  selector:
    app: vault
