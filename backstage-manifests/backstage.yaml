apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-pilot-db
  namespace: default
spec:
  selector:
    matchLabels:
      app: backstage-pilot-db
  template:
    metadata:
      labels:
        app: backstage-pilot-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: backstage-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-pilot-db-service
  namespace: default
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: backstage-pilot-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-pilot
  namespace: default
  labels:
    app: backstage-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-pilot
  template:
    metadata:
      labels:
        app: backstage-pilot
    spec:
      serviceAccountName: backstage-cluster-reader
      containers:
      - name: backstage
        image: backstage-pilot:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 7007
        env:
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_PASSWORD
        - name: BACKEND_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: BACKEND_SECRET
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: GITHUB_CLIENT_SECRET
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: GITHUB_TOKEN
              
        # --- KEYCLOAK MAPPINGS (MATCHING YOUR 6 CLEAN .ENV KEYS) ---
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: KEYCLOAK_CLIENT_ID
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: KEYCLOAK_CLIENT_SECRET
        - name: KEYCLOAK_METADATA_URL
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: KEYCLOAK_METADATA_URL
        - name: AUTH_KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: AUTH_KEYCLOAK_CLIENT_ID
        - name: AUTH_KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: AUTH_KEYCLOAK_CLIENT_SECRET
        - name: AUTH_KEYCLOAK_REALM
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: AUTH_KEYCLOAK_REALM
        - name: ARGOCD_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: ARGOCD_TOKEN
              
        volumeMounts:
        - name: catalog-files-volume
          mountPath: /app/catalog
        - name: main-config-volume
          mountPath: /app/app-config.yaml
          subPath: app-config.yaml
        securityContext:
          allowPrivilegeEscalation: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
      - name: catalog-files-volume
        configMap:
          name: backstage-local-users-cm
      - name: main-config-volume
        configMap:
          name: backstage-config
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-pilot-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 7007
    targetPort: 7007
  selector:
    app: backstage-pilot