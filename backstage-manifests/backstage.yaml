apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-pilot
  namespace: default
  labels:
    app: backstage-pilot
  annotations:
    secret.reloader.stakater.com/reload: "backstage-app-config"
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backstage-pilot
  template:
    metadata:
      labels:
        app: backstage-pilot
    spec:
      serviceAccountName: backstage-cluster-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backstage
          image: backstage-pilot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7007
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 45  # Gives Node.js time to boot up before testing
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 90  # Keeps the pod alive during long initial load sequences
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
          envFrom:
            - secretRef:
                name: backstage-app-config
          volumeMounts:
            - mountPath: /app/catalog
              name: catalog-files-volume
            - mountPath: /mnt/config-overrides
              name: app-config-overrides
      volumes:
        - name: catalog-files-volume
          configMap:
            name: backstage-local-users-cm
        - name: app-config-overrides
          configMap:
            name: backstage-app-config-cm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-pilot-db
  namespace: default
spec:
  selector:
    matchLabels:
      app: backstage-pilot-db
  template:
    metadata:
      labels:
        app: backstage-pilot-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: backstage-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-pilot-db-service
  namespace: default
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: backstage-pilot-db