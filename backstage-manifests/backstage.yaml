apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-pilot
  namespace: default
  annotations:
    secret.reloader.stakater.com/reload: "backstage-app-config"
  labels:
    app: backstage-pilot
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: backstage-pilot
  template:
    metadata:
      labels:
        app: backstage-pilot
    spec:
      serviceAccountName: backstage-cluster-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: backstage
        image: backstage-pilot:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7007
        securityContext:
          allowPrivilegeEscalation: false
        args: ["node", "packages/backend", "--config", "app-config.yaml"]
        envFrom:
        - secretRef:
            name: backstage-app-config
        volumeMounts:
        - mountPath: /app/catalog
          name: catalog-files-volume
      volumes:
      - configMap:
          name: backstage-local-users-cm
        name: catalog-files-volume
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-pilot-db
  namespace: default
spec:
  selector:
    matchLabels:
      app: backstage-pilot-db
  template:
    metadata:
      labels:
        app: backstage-pilot-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: backstage-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-pilot-db-service
  namespace: default
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: backstage-pilot-db