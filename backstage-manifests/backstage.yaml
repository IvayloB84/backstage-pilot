apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-pilot
  namespace: default
  labels:
    app: backstage-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-pilot
  template:
    metadata:
      labels:
        app: backstage-pilot
      annotations:
        # 1. Enable Vault Dynamic Sidecar Injection Engine
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "backstage-role"
        vault.hashicorp.com/auth-path: "auth/kubernetes"
        
        # 2. Tell Vault to read your path data and extract it into a file layout
        vault.hashicorp.com/agent-inject-secret-env: "secret/data/backstage"
        vault.hashicorp.com/agent-inject-template-env: |
          {{- with secret "secret/data/backstage" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end -}}
    spec:
      serviceAccountName: backstage-cluster-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      hostAliases:
      - ip: "10.43.103.217"
        hostnames:
        - "localhost"
      containers:
      - name: backstage
        image: backstage-pilot:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 7007
        securityContext:
          allowPrivilegeEscalation: false
        # 3. Use an entrypoint wrapper argument sequence to load the injected variables right before node starts
        command: ["/bin/sh", "-c"]
        args:
          - |
            if [ -f /vault/secrets/env ]; then . /vault/secrets/env; fi
            node packages/backend --config app-config.yaml
        env:
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: APP_CONFIG_catalog_orphanStrategy
          value: "delete"
        - name: APP_CONFIG_catalog_processingIntervalSeconds
          value: "300"
        volumeMounts:
        - name: catalog-files-volume
          mountPath: /app/catalog
        - name: main-config-volume
          mountPath: /app/app-config.yaml
          subPath: app-config.yaml
      volumes:
      - name: catalog-files-volume
        configMap:
          name: backstage-local-users-cm
      - name: main-config-volume
        configMap:
          name: backstage-config
