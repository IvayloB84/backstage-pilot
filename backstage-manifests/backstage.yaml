apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-pilot
  namespace: default
  labels:
    app: backstage-pilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-pilot
  template:
    metadata:
      labels:
        app: backstage-pilot
    spec:
      serviceAccountName: backstage-cluster-reader
      containers:
      - name: backstage
        image: backstage-pilot:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 7007
        env:
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: POSTGRES_PASSWORD
        - name: BACKEND_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: BACKEND_SECRET
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: GITHUB_CLIENT_SECRET
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: GITHUB_TOKEN
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: KEYCLOAK_CLIENT_ID
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: KEYCLOAK_CLIENT_SECRET
        - name: KEYCLOAK_METADATA_URL
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: KEYCLOAK_METADATA_URL
        - name: AUTH_KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: AUTH_KEYCLOAK_CLIENT_ID
        - name: AUTH_KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: AUTH_KEYCLOAK_CLIENT_SECRET
        - name: AUTH_KEYCLOAK_REALM
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: AUTH_KEYCLOAK_REALM
        - name: ARGOCD_TOKEN
          valueFrom:
            secretKeyRef:
              name: backstage-app-config
              key: ARGOCD_TOKEN
              
        # 🚀 SAFETIES: Direct runtime landscape overrides 
        - name: APP_CONFIG_catalog_orphanStrategy
          value: "delete"
        - name: APP_CONFIG_catalog_processingIntervalSeconds
          value: "20"
              
        volumeMounts:
        - name: catalog-files-volume
          mountPath: /app/catalog
        - name: main-config-volume
          mountPath: /app/app-config.yaml
          subPath: app-config.yaml
        securityContext:
          allowPrivilegeEscalation: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
      - name: catalog-files-volume
        configMap:
          name: backstage-local-users-cm
      - name: main-config-volume
        configMap:
          name: backstage-config