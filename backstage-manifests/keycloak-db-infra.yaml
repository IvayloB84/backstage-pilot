apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-db-deployment
  namespace: default
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.2
          args: ["start-dev"]
          env:
            # Modern Keycloak 26 admin initialization keys
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: "admin"
            
            # Network definitions avoiding port 8080
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HOSTNAME
              value: "http://localhost:8085"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HOSTNAME_STRICT
              value: "false"

            # --- DYNAMIC PLACEHOLDERS MAPPING FROM YOUR EXISTING SECRET ---
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://keycloak-db-service.default.svc.cluster.local:5433/keycloak_persistence"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backstage-app-config
                  key: KEYCLOAK_DB_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-app-config
                  key: KEYCLOAK_DB_PASSWORD
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: default
spec:
  ports:
    - name: http
      port: 8085            
      targetPort: 8080      
      protocol: TCP
  selector:
    app: keycloak