apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-production-config
  namespace: default
data:
  app-config.production.yaml: |
    app:
      title: Backstage Pilot Deployed
      baseUrl: http://localhost:7007
    backend:
      baseUrl: http://localhost:7007
      listen:
        host: 0.0.0.0
        port: 7007
      cors:
        origin: http://localhost:7007
      database:
        client: pg
        connection:
          host: backstage-db-service
          port: 5432
          user: postgres
          password: secret
    auth:
      environment: production
      providers:
        github:
          production:
            clientId: ${GITHUB_CLIENT_ID}
            clientSecret: ${GITHUB_CLIENT_SECRET}
    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}
