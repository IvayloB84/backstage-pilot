app:
  title: Scaffolded Backstage Pilot
  baseUrl: http://localhost:7000
  packages: all

  notifications:
    enabled: false
organization:
  name: My Company

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: [http://localhost:7000, http://127.0.0.1:7000, http://localhost:7007, http://127.0.0.1:7007]
    methods: [GET, POST, PUT, DELETE, OPTIONS]
    credentials: true
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: 5432
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ""
  reading:
    allow:
      - host: localhost
      - host: 127.0.0.1

  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

argocd:
  baseUrl: https://127.0.0.1:8443

proxy:
  endpoints:
    '/argocd/api':
      target: https://argocd-server.argocd.svc.cluster.local/api/v1/
      changeOrigin: true
      secure: false
      headers:
        Authorization: Bearer ${ARGOCD_TOKEN}
        Host: argocd-server.argocd.svc.cluster.local

    '/argocd':
      target: https://argocd-server.argocd.svc.cluster.local/api/v1/
      changeOrigin: true
      secure: false
      headers:
        Authorization: Bearer ${ARGOCD_TOKEN}
        Host: argocd-server.argocd.svc.cluster.local

kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - url: https://127.0.0.1:33427
          name: k3s-cluster
          authProvider: 'serviceAccount'
          serviceAccountToken: ${K3S_TOKEN}
          skipTLSVerify: true
          namespaces:
            - default

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

auth:
  environment: development
  providers:
    guest:
      userEntityRef: user:default/IvayloB84
      dangerouslyAllowOutsideDevelopment: true
    github:
      development:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]
      rules:
        - allow: [User]

  locations:
    - type: file
      target: /app/catalog/org-users.yaml

    - type: file
      target: ./catalog/components.yaml

    - type: file
      target: ./catalog/argo-live-service-final.yaml