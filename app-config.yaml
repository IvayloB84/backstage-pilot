app:
  title: Scaffolded Backstage Pilot
  baseUrl: http://localhost:7000
  packages: all

organization:
  name: My Company

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: [http://localhost:7000, http://127.0.0.1:7000, http://localhost:7007, http://127.0.0.1:7007]
    methods: [GET, POST, PUT, DELETE, OPTIONS]
    credentials: true
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: 5432
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ""
  reading:
    allow:
      - host: localhost
      - host: 127.0.0.1

  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

argocd:
  baseUrl: https://127.0.0.1:8443

proxy:
  endpoints:
    '/argocd/api':
      target: https://127.0.0.1:8443/api/v1/
      changeOrigin: true
      secure: false
      headers:
        Authorization: Bearer ${ARGOCD_TOKEN}

kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - url: https://127.0.0.1:33427
          name: k3s-cluster
          authProvider: 'serviceAccount'
          serviceAccountToken: ${K3S_TOKEN}
          skipTLSVerify: true
          namespaces:
            - default

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

auth:
  environment: development
  providers:
    github:
      development:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]

  # Using full absolute locations to guarantee that your User entity is forced into the catalog on startup
  locations:
    - type: file
      target: /media/theone/HDD/docker-files/github_projects/backstage-pilot/catalog-info.yaml
    - type: file
      target: /media/theone/HDD/docker-files/github_projects/backstage-pilot/examples/org.yaml
    - type: file
      target: /media/theone/HDD/docker-files/github_projects/backstage-pilot/examples/template/template.yaml