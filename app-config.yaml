app:
  title: Scaffolded Backstage Pilot
  baseUrl: http://localhost:7007
  packages: all
  extensions:
    - entity-content:catalog/kubernetes:
        disabled: true

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  cors:
    origin: [http://localhost:7007, http://127.0.0.1:7007]
    methods: [GET, POST, PUT, DELETE, OPTIONS]
    credentials: true
  auth:
    keys:
     - secret: "${BACKEND_SECRET}"

  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: postgres

proxy:
  endpoints:
    'argocd/api':
      target: http://argocd-server.argocd.svc.cluster.local/api/v1/
      changeOrigin: true
      secure: false
      allowedHeaders:
        - Authorization
      headers:
        Authorization: ${ARGOCD_TOKEN}

kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - url: https://kubernetes.default.svc
          name: k3s-cluster
          authProvider: 'serviceAccount'
          skipTLSVerify: true
          id: k3s-pilot

argocd:
  baseUrl: http://argocd-server.argocd.svc.cluster.local
  appLocatorMethods:
    - type: 'config'
      instances:
        - name: main-argo
          url: http://argocd-server.argocd.svc.cluster.local
          token: "${ARGOCD_TOKEN}"
          secure: false

catalog:

  import:
    entityFilename: catalog-info.yaml
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]
  locations:
    - type: file
      target: ./catalog/org-users.yaml
    - type: file
      target: ./catalog/components.yaml
    - type: url
      target: https://github.com/IvayloB84/backstage-templates/blob/main/manifests/github-repo-template.yaml

  providers:
    keycloakOrg:
      default:
        # Internal cluster endpoint line
        baseUrl: http://keycloak-service.default.svc.cluster.local:8085
        loginRealm: ${AUTH_KEYCLOAK_REALM}
        realm: ${AUTH_KEYCLOAK_REALM}
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }

auth:
  environment: development
  providers:
    github:
      development:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName
    keycloak:
      development:
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        realm: ${AUTH_KEYCLOAK_REALM}
        baseUrl: http://localhost:8085
        
        metadataUrl: http://localhost:8085/realms/${AUTH_KEYCLOAK_REALM}/.well-known/openid-configuration
        tokenUrl: http://localhost:8085/realms/${AUTH_KEYCLOAK_REALM}/protocol/openid-connect/token
        
        signIn:
          resolvers:
            - resolver: preferredUsernameMatchingUserEntityName

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}
