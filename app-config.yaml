app:
  title: Scaffolded Backstage Pilot
  baseUrl: http://localhost:7007
  packages: all
  extensions:
    - entity-content:catalog/kubernetes:
        disabled: true

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  cors:
    origin: [http://localhost:7007, http://127.0.0.1:7007]
    methods: [GET, POST, PUT, DELETE, OPTIONS]
    credentials: true
  auth:
    keys:
     - secret: "${BACKEND_SECRET}"

  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: postgres

proxy:
  endpoints:
    'argocd/api':
      target: http://argocd-server.argocd.svc.cluster.local/api/v1/
      changeOrigin: true
      secure: false
      allowedHeaders:
        - Authorization
      headers:
        Authorization: "Bearer ${ARGOCD_TOKEN}"

kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - url: https://kubernetes.default.svc
          name: k3s-cluster
          authProvider: 'serviceAccount'
          skipTLSVerify: true
          id: k3s-pilot

argocd:
  baseUrl: http://argocd-server.argocd.svc.cluster.local
  appLocatorMethods:
    - type: 'config'
      instances:
        - name: main-argo
          url: http://argocd-server.argocd.svc.cluster.local
          token: "${ARGOCD_TOKEN}"
          secure: false

catalog:
  orphanStrategy: delete
  orphanProviderStrategy: delete
  import:
    entityFilename: catalog-info.yaml
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]
  locations:
    - type: file
      target: /app/org-data.yaml
    - type: url
      target: https://github.com/IvayloB84/backstage-pilot/blob/main/catalog/org-users.yaml
    - type: file
      target: ./catalog/components.yaml
    - type: url
      target: https://github.com/IvayloB84/backstage-templates/tree/main/manifests/*.yaml

  providers:
    keycloakOrg:
      default:
        baseUrl: ${KEYCLOAK_INTERNAL_URL}
        realm: ${AUTH_KEYCLOAK_REALM}
        clientId: ${AUTH_KEYCLOAK_CLIENT_ID}
        clientSecret: ${AUTH_KEYCLOAK_CLIENT_SECRET}
        schedule:
          frequency: { minutes: 15 }
          timeout: { minutes: 3 }
          initialDelay: { seconds: 10 }

auth:
  environment: development
  session:
    secret: ${BACKEND_SECRET}
  providers:
    github:
      development:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

    oidc:
      development:
        clientId: ${KEYCLOAK_CLIENT_ID}
        clientSecret: ${KEYCLOAK_CLIENT_SECRET}
        metadataUrl: ${KEYCLOAK_METADATA_URL}
        prompt: auto
        metadata:
          issuer: http://localhost:8085/realms/backstage
          authorization_endpoint: http://localhost:8085/realms/backstage/protocol/openid-connect/auth
          
          # --- FIXED INTERNAL CLUSTER ROUTING FOR THE BACK-CHANNEL ---
          token_endpoint: http://keycloak-service.default.svc.cluster.local:8085/realms/backstage/protocol/openid-connect/token
          jwks_uri: http://keycloak-service.default.svc.cluster.local:8085/realms/backstage/protocol/openid-connect/certs
        signIn:
          resolvers:
            - resolver: emailMatchingUserEntityProfileEmail

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}
