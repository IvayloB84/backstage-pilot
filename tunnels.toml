[[tunnels]]
name = "1. Grafana Dashboards"
url = "http://localhost:8888"
namespace = "argocd"
match_service = "grafana"
local_port = 8888
remote_port = 80

[[tunnels]]
name = "2. Keycloak Persistence DB"
url = "localhost:5433"
namespace = "default"
match_service = "keycloak-postgres"
local_port = 5433
remote_port = 5433

[[tunnels]]
name = "3. Keycloak IAM Server"
url = "http://localhost:8085"
namespace = "default"
primary_target = "service/keycloak-service"
match_service = "keycloak"
fallback_target = "deployment/keycloak-server"
local_port = 8085
remote_port = 8085

[[tunnels]]
name = "4. ArgoCD GitOps Control"
url = "https://localhost:8443"
namespace = "argocd"
primary_target = "service/argocd-server"
match_service = "argocd-server"
local_port = 8443
remote_port = 443

[[tunnels]]
name = "5. Production Rails App"
url = "http://localhost:8080"
namespace = "kube-system"
match_service = "traefik"
local_port = 8080
remote_port = 80

[[tunnels]]
name = "6. Backstage Platform App"
url = "http://localhost:7007"
namespace = "default"
match_service = "backstage-pilot"
fallback_target = "deployment/backstage-pilot"
local_port = 7007
remote_port = 7007

[[tunnels]]
name = "7. PostgreSQL Core Cache"
url = "localhost:5432"
namespace = "default"
match_service = "backstage-pilot-db"
local_port = 5432
remote_port = 5432

[[tunnels]]
name = "8. HashiCorp Vault Server"
url = "http://localhost:8200"
namespace = "default"
match_service = "vault"
fallback_target = "deployment/vault-server"
local_port = 8200
remote_port = 8200
auto_unseal_vault = true

