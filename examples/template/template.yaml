apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: automated-gitops-node-template
  title: Automated GitOps Node.js Service
  description: Create a Node.js microservice with automated k3s and ArgoCD tracking built-in.
spec:
  owner: group:development
  type: service

  parameters:
    - title: Provide Service Metadata
      required:
        - name:
        - owner
      properties:
        name:
          title: Service Name
          type: string
          description: Unique name for your service (lowercase, alphanumeric, no spaces).
        owner:
          title: Owner group
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group

  steps:
    # Step 1: Unpack your starter code files
    - id: fetch-base
      name: Fetch Base Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}

    # Step 2: Push the new application code repository to GitHub
    - id: publish-app
      name: Publish App Code to GitHub
      action: publish:github
      input:
        allowedOwners:
          - IvayloB84
        repoUrl: ://github.com{{ parameters.name }}
        repoVisibility: public
        defaultBranch: main

    # Step 3: Register the tracking catalog component entity with Backstage
    - id: register
      name: Register Component in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-app'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    # Step 4: Automatically add the new deployment tracking file to ArgoCD-RootApps
    - id: register-argocd
      name: Register App inside ArgoCD-RootApps
      action: publish:github:pull-request
      input:
        repoUrl: ://github.com
        branchName: argocd-sync-${{ parameters.name }}
        title: "infra: automatically register tracking manifest for ${{ parameters.name }}"
        description: "Brought to you automatically by your Backstage Software Template engine."
        supportsInterleavedMins: true
        updateFiles:
          - path: apps/${{ parameters.name }}.yaml
            content: |
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: ${{ parameters.name }}
                namespace: argocd
                labels:
                  backstage.io/kubernetes-id: ${{ parameters.name }}
              spec:
                project: default
                source:
                  repoURL: https://github.com{{ parameters.name }}.git
                  targetRevision: HEAD
                  path: k8s
                destination:
                  server: https://default.svc
                  namespace: default
                syncPolicy:
                  automated:
                    prune: true
                    selfHeal: true

  output:
    links:
      - title: Open Generated Repository Code
        url: ${{ steps['publish-app'].output.remoteUrl }}
      - title: Open Backstage Catalog Component
        url: ${{ steps['register'].output.catalogInfoUrl }}
