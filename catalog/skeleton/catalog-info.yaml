apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.repoName }}
  description: ${{ values.description }}
  annotations:
    argocd/app-name: ${{ values.repoName | dump }}
    backstage.io/kubernetes-id: ${{ values.repoName | dump }}
spec:
  type: service
  lifecycle: experimental
  owner: user:default/${{ values.repoOwner }}
