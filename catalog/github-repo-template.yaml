  steps:
    # 📝 Step 1: Fetch your template skeleton cleanly from GitHub
    - id: fetch-base
      name: Fetch Base Skeleton
      action: fetch:template
      input:
        url: https://github.com/IvayloB84/backstage-pilot/tree/main/catalog/skeleton
        values:
          repoName: ${{ parameters.repoName }}
          repoOwner: ${{ parameters.repoOwner }}
          description: ${{ parameters.description }}

    # 🤖 Step 2: Fetch the raw ArgoCD Application file securely without API translation
    - id: fetch-argocd
      name: Fetch ArgoCD Control Manifest
      action: fetch:plain:file
      input:
        url: https://github.com/IvayloB84/backstage-pilot/raw/main/catalog/argocd-app.tmpl.yaml
        # 🎯 FIX: Name it correctly in the workspace so the PR creates the right file name
        targetPath: ./${{ parameters.repoName }}.yaml

    # ⚙️ Step 3: Parse and inject your dynamic variables right inside the file
    - id: render-argocd
      name: Inject ArgoCD Target Variables
      action: template:replace
      input:
        files:
          - ./${{ parameters.repoName }}.yaml
        values:
          repoName: ${{ parameters.repoName }}
          repoOwner: ${{ parameters.repoOwner }}

    # 🔗 Step 4: Publish the generated catalog file directly to a new GitHub repo
    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: 'github.com?repo=${{ parameters.repoName }}&owner=${{ parameters.repoOwner }}'
        repoVisibility: public
        description: ${{ parameters.description }}
        defaultBranch: main

    # 🐙 Step 5: AUTOMATED GITOPS DISCOVERY TRACK
    - id: publish-gitops-manifest
      name: Commit Control Manifest to ArgoCD Root Apps Folder
      action: publish:github:pull-request
      input:
        repoUrl: 'github.com?repo=ArgoCD-RootApps&owner=IvayloB84'
        # 🎯 FIX: Changed targetPath to backstage-apps to match your dynamic isolation folder
        targetPath: 'argocd-apps'
        title: 'infra: register automated deployment loops for ${{ parameters.repoName }}'
        description: 'Automated ArgoCD manifest addition generated from Backstage software template.'
        branchName: 'argo-sync-${{ parameters.repoName }}'

    # 📁 Step 6: Register the new repository location back into your Backstage catalog
    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml