version: 2
updates:
  # Check for updates to your yarn.lock dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Optional: Keep your GitHub Actions workflows secure as well
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
