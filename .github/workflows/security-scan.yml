name: Repository Security Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Code & Secret Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified

      - name: Validate App Configuration Formatting Schema
        run: |
          echo "🔍 Auditing app-config.yaml for un-templated private assets..."
          TARGET_CONFIG="app-config.yaml"
          if [ -f "$TARGET_CONFIG" ]; then
            if grep -E 'ghp_[A-Za-z0-9]{36}|eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+' "$TARGET_CONFIG"; then
              echo "❌ ERROR: Hardcoded credentials or JWT tokens detected inside $TARGET_CONFIG!"
              exit 1
            fi
            if grep -q "serviceAccountToken:" "$TARGET_CONFIG" && ! grep -q "serviceAccountToken: \${" "$TARGET_CONFIG"; then
              echo "❌ ERROR: Hardcoded serviceAccountToken string value detected! Use \${K3S_TOKEN} instead."
              exit 1
            fi
            echo "✅ app-config.yaml schema parameters verified successfully."
          else
            echo "⚠️  No local app-config.yaml located in root context slot. Skipping formatting checks."
          fi

      - name: Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci

  docker-validation:
    name: Dockerfile Lint & Image Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Hadolint Linter
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Build Local Container Image
        run: |
          docker build -t backstage-pilot:local .

      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backstage-pilot:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'