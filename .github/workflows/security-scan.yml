name: Repository Security Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Code & Secret Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@3080597b355498877f2fb40176964096054ba9f4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@021a0f8bfdf8eb64fa9c6d486a60e0a30b5030f4
        with:
          path: ./
          extra_args: --results=verified

      - name: Validate App Configuration Formatting Schema
        run: |
          echo "🔍 Auditing app-config.yaml for un-templated private assets..."
          TARGET_CONFIG="app-config.yaml"
          if [ -f "$TARGET_CONFIG" ]; then
            if grep -E 'ghp_[A-Za-z0-9]{36}|eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+' "$TARGET_CONFIG"; then
              echo "❌ ERROR: Hardcoded credentials or JWT tokens detected inside $TARGET_CONFIG!"
              exit 1
            fi
            if grep -q "serviceAccountToken:" "$TARGET_CONFIG" && ! grep -q "serviceAccountToken: \${" "$TARGET_CONFIG"; then
              echo "❌ ERROR: Hardcoded serviceAccountToken string value detected! Use \${K3S_TOKEN} instead."
              exit 1
            fi
            echo "✅ app-config.yaml schema parameters verified successfully."
          else
            echo "⚠️  No local app-config.yaml located in root context slot. Skipping formatting checks."
          fi

      - name: Semgrep SAST Scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep ci --config=p/ci

  docker-validation:
    name: Dockerfile Static Analysis & Configuration Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Hadolint Linter
        uses: hadolint/hadolint-action@54c83aa256193ee0657b2824961b369ba0106208
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Trivy Static Config Scan
        uses: aquasecurity/trivy-action@6e07ee2366b2e3e57f3cb411db14eeeb899b1a20
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'