app:
  baseUrl: http://localhost:7007
  title: "Scaffolded Backstage Pilot"
  packages: "all"

backend:
  baseUrl: http://localhost:7007
  listen:
    host: 0.0.0.0
    port: 7007
  auth:
    dangerouslyDisableDefaultAuthPolicy: true
  cors:
    origin: http://localhost:7007
    methods: [GET, POST, PUT, DELETE]
    credentials: true
    keys:
      - secret: ${BACKEND_SECRET}
  database:
    client: pg
    connection:
      host: backstage-pilot-db-service
      port: 5432
      user: postgres
      password: secret

auth:
  environment: production
  providers:
    guest:
      userEntityRef: user:default/IvayloB84
      dangerouslyAllowOutsideDevelopment: true
    github:
      production:
        clientId: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

argocd:
  baseUrl: https://localhost:8443

proxy:
  endpoints:
    '/argocd/api':
      target: https://argocd-server.argocd.svc.cluster.local/api/v1
      changeOrigin: true
      secure: false
      headers:
        Authorization: Bearer ${ARGOCD_TOKEN}

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: k3d-my-rootless-cluster
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          serviceAccountToken: ${K3S_TOKEN}
          skipTLSVerify: true
          skipMetricsLookup: false

catalog:
  providers: {}
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]

  locations:
    # 1. Your stable local components file
    - type: file
      target: ./catalog/components.yaml

    # 2. Your local user account definitions (keeps you logged in!)
    - type: file
      target: ./catalog/org-users.yaml

    # 3. Your cache-breaking template pulled safely over the GitHub URL link
    - type: url
      target: https://github.com/IvayloB84/backstage-pilot/blob/template-repaired-run/catalog/github-repo-template.yaml

organization:
  name: "My Company"

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

techdocs:
  builder: local
